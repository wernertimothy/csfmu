name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Build every model and run its unit tests and pytest suite, the same way
  # as locally with "csfmu test <model>"
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      # Build with MSVC through Ninja: "csfmu test" runs ctest without a
      # configuration, which the multi-config Visual Studio generator needs
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Select the Ninja generator
        if: runner.os == 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: uv sync

      - name: Build and test all models
        run: |
          for model in $(uv run csfmu list | tr -d '\r'); do
            echo "::group::$model"
            uv run csfmu test "$model"
            echo "::endgroup::"
          done

  # Run the C unit tests with AddressSanitizer (incl. leak detection) and
  # UndefinedBehaviorSanitizer; variable-length arrays are rejected because
  # MSVC does not support them. fault_injection adds a C test of the discard
  # and rollback path of fmi2DoStep (tests/models/fault_injection/)
  sanitizers:
    name: Sanitizers (${{ matrix.model }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [mass_spring_damper, fault_injection]
    env:
      SANITIZER_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build/sanitizers
          -DMODEL=${{ matrix.model }}
          -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_C_FLAGS=$SANITIZER_FLAGS -Werror=vla"
          "-DCMAKE_CXX_FLAGS=$SANITIZER_FLAGS"

      - name: Build
        run: cmake --build build/sanitizers

      - name: Run unit tests
        run: ctest --test-dir build/sanitizers --output-on-failure

  # Load two FMUs of this template into one process, the first one with
  # RTLD_GLOBAL. Only ELF platforms can mix up their symbols, so this is
  # only meaningful on Linux.
  two-fmus:
    name: Two FMUs in one process
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install Python dependencies
        run: uv sync

      - name: Build two models
        run: |
          uv run csfmu build mass_spring_damper
          uv run csfmu build typed_demo

      - name: Load both FMUs into one process
        env:
          CSFMU_REQUIRE_TWO_FMUS: "1"
        run: uv run pytest tests/integration/test_two_fmus.py -v

  # Tests of the csfmu tool, which do not depend on a model. Creating a model
  # with "csfmu new" and testing it catches a scaffold template, C or C++,
  # that no longer fits the modelDefinition API
  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install Python dependencies
        run: uv sync

      - name: Unit tests of the CLI
        run: uv run pytest tools/tests

      - name: Create, build and test a new model
        run: |
          uv run csfmu new scaffold_probe
          uv run csfmu test scaffold_probe

      - name: Create, build and test a new C++ model
        run: |
          uv run csfmu new scaffold_probe_cpp --cpp
          uv run csfmu test scaffold_probe_cpp

  # Line coverage of src/ over the C and Python tests of every model. Report
  # only, there is no threshold. CMake takes CFLAGS, CXXFLAGS and LDFLAGS from
  # the environment when it configures a build folder for the first time
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CFLAGS: --coverage
      CXXFLAGS: --coverage
      LDFLAGS: --coverage
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install Python dependencies
        run: uv sync

      # The coverage runtime adds gcov symbols to the exports of the FMU, so
      # the exported-symbols check runs in the test job only
      - name: Build and test all models with coverage
        run: |
          for model in $(uv run csfmu list); do
            echo "::group::$model"
            uv run csfmu test "$model" -- --deselect tests/integration/test_exported_symbols.py::test_only_fmi2_functions_are_exported
            echo "::endgroup::"
          done

      - name: Coverage report
        run: |
          mkdir -p coverage
          uvx gcovr --root . --filter src/ --txt coverage/summary.txt --html-details coverage/index.html build/
          { echo '```'; cat coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
