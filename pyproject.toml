[project]
name = "csfmu"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fmpy>=0.3.20",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.0",
    "ruff>=0.17.6",
]

[project.scripts]
csfmu = "csfmu.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "tools"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
