[project]
name = "csfmu"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "fmpy>=0.3.20",
    "matplotlib>=3.11.2",
    "pytest>=8.0",
]

[project.scripts]
csfmu = "csfmu.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "tools"
